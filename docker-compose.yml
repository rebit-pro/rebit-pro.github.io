# Локальное окружение ReBit Studio.
#
#   docker compose up dev                 → dev-сервер с HMR на http://localhost:5173
#   docker compose --profile preview up   → сборка + предпросмотр на http://localhost:4173
#
# Том node_modules хранит зависимости внутри контейнера и не конфликтует с хостом.
services:
  dev:
    build: .
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Надёжное отслеживание изменений файлов на bind-mount (Windows/WSL).
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  preview:
    profiles: ["preview"]
    build: .
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    ports:
      - "4173:4173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
